[project]
name = "collab-board-backend"
version = "0.1.0"
description = "Collab Board FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi-offline>=1.7.7",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-jose[cryptography]>=3.5.0",
    "redis[hiredis]>=8.1.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
